<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e15"/>
      <stop offset="0.55" stop-color="#0b0d13"/>
      <stop offset="1" stop-color="#10131d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="21.25" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- decorative area chart (right) -->
  <g opacity="0.95">
    <g stroke="#ffffff" stroke-opacity="0.05">
      <line x1="772" y1="104" x2="1136" y2="104"/>
      <line x1="772" y1="142" x2="1136" y2="142"/>
      <line x1="772" y1="180" x2="1136" y2="180"/>
      <line x1="772" y1="218" x2="1136" y2="218"/>
    </g>
    <path d="M772 206 C 800 200 818 188 846 192 C 874 196 884 214 912 212 C 940 210 948 168 978 166 C 1006 164 1014 186 1042 182 C 1070 178 1082 132 1110 122 C 1122 118 1130 114 1136 112 L 1136 230 L 772 230 Z" fill="url(#area)"/>
    <path d="M772 206 C 800 200 818 188 846 192 C 874 196 884 214 912 212 C 940 210 948 168 978 166 C 1006 164 1014 186 1042 182 C 1070 178 1082 132 1110 122 C 1122 118 1130 114 1136 112" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="1136" cy="112" r="11" fill="#818cf8" fill-opacity="0.22"/>
    <circle cx="1136" cy="112" r="5" fill="#c7d2fe"/>
  </g>

  <!-- logo tile -->
  <rect x="72" y="96" width="96" height="96" rx="24" fill="url(#tile)"/>
  <rect x="72.5" y="96.5" width="95" height="95" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <svg x="72" y="96" width="96" height="96" viewBox="0 0 48 48">
    <g transform="translate(4.6 4.6) scale(0.84)" stroke-linecap="round">
      <g opacity="0.82">
        <line x1="8.5" y1="22" x2="8.5" y2="36" stroke="#fff" stroke-width="2"/>
        <rect x="6" y="26" width="7" height="7" rx="2" fill="#fff"/>
        <line x1="18.5" y1="16" x2="18.5" y2="32" stroke="#fff" stroke-width="2"/>
        <rect x="15" y="20" width="7" height="9" rx="2" fill="#fff"/>
        <line x1="29.5" y1="11" x2="29.5" y2="28" stroke="#fff" stroke-width="2"/>
        <rect x="26" y="14" width="7" height="10" rx="2" fill="#fff"/>
      </g>
      <line x1="40.5" y1="6" x2="40.5" y2="24" stroke="#fff" stroke-width="2"/>
      <rect x="37" y="9" width="7" height="11" rx="2" fill="#fff"/>
    </g>
  </svg>

  <!-- wordmark -->
  <text x="196" y="142" font-size="54" font-weight="800" letter-spacing="-1" fill="url(#ink)">
    <tspan>Capi</tspan><tspan fill="#a5b4fc" font-weight="700">track</tspan>
  </text>

  <!-- tagline -->
  <text x="198" y="178" font-size="20" font-weight="500" fill="#9aa6bf">Self-hosted wealth tracking for stocks, crypto &amp; commodities</text>

  <!-- asset chips -->
  <g font-size="14" font-weight="600">
    <g>
      <rect x="198" y="198" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="214" cy="213" r="3.5" fill="#818cf8"/>
      <text x="226" y="218" fill="#cbd5e1">Stocks</text>
    </g>
    <g>
      <rect x="300" y="198" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="316" cy="213" r="3.5" fill="#f7931a"/>
      <text x="328" y="218" fill="#cbd5e1">Crypto</text>
    </g>
    <g>
      <rect x="402" y="198" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="418" cy="213" r="3.5" fill="#eab308"/>
      <text x="430" y="218" fill="#cbd5e1">Commodities</text>
    </g>
    <g>
      <rect x="544" y="198" width="146" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="560" cy="213" r="3.5" fill="#38bdf8"/>
      <text x="572" y="218" fill="#cbd5e1">Multi-currency</text>
    </g>
  </g>
</svg>
