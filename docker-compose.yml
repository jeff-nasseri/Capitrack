# Capitrack — .NET 10 API + Blazor WebAssembly frontend.
# One command runs both:  docker compose up -d
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: capitrack-api
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/capitrack.db
      # Initial admin login, first run only. Configure these in a local .env file
      # (gitignored — see .env.example). If the password is left empty a strong one
      # is generated and printed to the logs:  docker compose logs api
      - CAPITRACK_INIT_USERNAME=${CAPITRACK_INIT_USERNAME:-admin}
      - CAPITRACK_INIT_PASSWORD=${CAPITRACK_INIT_PASSWORD:-}
      - CAPITRACK_BASE_CURRENCY=${CAPITRACK_BASE_CURRENCY:-EUR}
    volumes:
      - capitrack-dotnet-data:/app/data
      - ./transactions:/app/transactions:ro
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: capitrack-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  capitrack-dotnet-data:
