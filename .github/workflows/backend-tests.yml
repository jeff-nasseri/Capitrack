name: Backend Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  domain-unit-tests:
    name: Server.Tests (domain unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run domain unit tests
        run: dotnet test tests/Server.Tests/Server.Tests.csproj -c Release --logger "console;verbosity=normal"
