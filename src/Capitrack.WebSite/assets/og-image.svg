<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e15"/>
      <stop offset="0.55" stop-color="#0a0c12"/>
      <stop offset="1" stop-color="#11141e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe1ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- full-width chart motif along the bottom -->
  <g opacity="0.9">
    <path d="M0 470 C 120 458 180 432 300 442 C 430 452 470 498 600 492 C 720 487 760 410 900 404 C 1010 399 1070 432 1140 416 C 1162 411 1182 404 1200 398 L 1200 630 L 0 630 Z" fill="url(#area)"/>
    <path d="M0 470 C 120 458 180 432 300 442 C 430 452 470 498 600 492 C 720 487 760 410 900 404 C 1010 399 1070 432 1140 416 C 1162 411 1182 404 1200 398" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <circle cx="900" cy="404" r="9" fill="#818cf8" fill-opacity="0.22"/>
    <circle cx="900" cy="404" r="4.5" fill="#c7d2fe"/>
  </g>

  <!-- logo tile (centered) -->
  <rect x="534" y="120" width="132" height="132" rx="32" fill="url(#tile)"/>
  <rect x="534.5" y="120.5" width="131" height="131" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <svg x="534" y="120" width="132" height="132" viewBox="0 0 48 48">
    <g transform="translate(4.6 4.6) scale(0.84)" stroke-linecap="round">
      <g opacity="0.82">
        <line x1="8.5" y1="22" x2="8.5" y2="36" stroke="#fff" stroke-width="2"/>
        <rect x="6" y="26" width="7" height="7" rx="2" fill="#fff"/>
        <line x1="18.5" y1="16" x2="18.5" y2="32" stroke="#fff" stroke-width="2"/>
        <rect x="15" y="20" width="7" height="9" rx="2" fill="#fff"/>
        <line x1="29.5" y1="11" x2="29.5" y2="28" stroke="#fff" stroke-width="2"/>
        <rect x="26" y="14" width="7" height="10" rx="2" fill="#fff"/>
      </g>
      <line x1="40.5" y1="6" x2="40.5" y2="24" stroke="#fff" stroke-width="2"/>
      <rect x="37" y="9" width="7" height="11" rx="2" fill="#fff"/>
    </g>
  </svg>

  <!-- wordmark -->
  <text x="600" y="350" text-anchor="middle" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#ink)">
    <tspan>Capi</tspan><tspan fill="#a5b4fc" font-weight="700">track</tspan>
  </text>

  <!-- tagline -->
  <text x="600" y="404" text-anchor="middle" font-size="29" font-weight="500" fill="#9aa6bf">Self-hosted wealth tracking for stocks, crypto &amp; commodities</text>

  <!-- asset chips, centered -->
  <g font-size="17" font-weight="600">
    <g>
      <rect x="337" y="450" width="104" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
      <circle cx="357" cy="468" r="4" fill="#818cf8"/>
      <text x="371" y="474" fill="#cbd5e1">Stocks</text>
    </g>
    <g>
      <rect x="451" y="450" width="104" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
      <circle cx="471" cy="468" r="4" fill="#f7931a"/>
      <text x="485" y="474" fill="#cbd5e1">Crypto</text>
    </g>
    <g>
      <rect x="565" y="450" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
      <circle cx="585" cy="468" r="4" fill="#eab308"/>
      <text x="599" y="474" fill="#cbd5e1">Commodities</text>
    </g>
    <g>
      <rect x="725" y="450" width="162" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
      <circle cx="745" cy="468" r="4" fill="#38bdf8"/>
      <text x="759" y="474" fill="#cbd5e1">Multi-currency</text>
    </g>
  </g>

  <!-- footer wordmark -->
  <text x="600" y="566" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="3" fill="#6b7494">CAPITRACK.DEV  ·  OPEN SOURCE  ·  MIT</text>
</svg>
