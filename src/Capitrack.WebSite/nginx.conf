server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for static assets, styles and scripts.
    location ~* \.(?:png|jpg|jpeg|svg|webp|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Clean URLs: serve /docs/getting-started as getting-started.html, etc.
    # Falls back to the requested path, then a directory index, then .html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
